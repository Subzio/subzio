name: Update Proxy List

on:
  schedule:
    - cron: '12 */2 * * *'  # Every 2 hours
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: proxy-list-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # Sources are read from source-list.txt in the repository (ignore lines starting with '#')

    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: Sync with remote main
      run: |
        set -euo pipefail
        # Fetch latest main and reset working tree to match remote
        git fetch --prune origin main
        git checkout --force main || git checkout -B main
        git reset --hard origin/main

    - name: Fetch URL sources into input/
      run: |
        set -euo pipefail
        rm -rf input/*
        mkdir -p input

        # Read non-comment lines from `source-list.txt`
        echo "Using source-list.txt"
        mapfile -t lines < <(grep -E '^[[:space:]]*[^#[:space:]]' source-list.txt || true)

        idx=0
        for url in "${lines[@]}"; do
          url=$(echo "$url" | tr -d '\r' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          if [ -z "$url" ]; then
            continue
          fi

          idx=$((idx+1))
          out="input/${idx}.txt"

          echo "Downloading $url -> $out"
          if curl -fsSL "$url" -o "$out"; then
            echo "Saved $out"
          else
            echo "Warning: failed to download $url"
            rm -f "$out" || true
          fi
        done

    - name: Process, archive, and build rolling collection
      run: |
        set -euo pipefail
        archive_dir="WHITE_LIST_PROXY_COLLECTION"
        mkdir -p "$archive_dir"
        current=$(mktemp)
        combined=$(mktemp)
        trap 'rm -f "$current" "$combined"' EXIT

        # Filter this run's inputs, preserving duplicates in the snapshot.
        shopt -s nullglob
        for file in input/*.txt; do
            echo "Processing $file..."
            awk '
            /^(ss|socks):\/\// { next }                                 # remove SS
            /xtls-rprx-vision-udp443/ { next }                          # Is not supported by sing box clients
            /Russia|RU|%F0%9F%87%B7%F0%9F%87%BA%20|Россия/ { next }                             # Filter our Russian servers by a key name
            /xmux/ { next }                                            # Is not supported by sing box clients
            /extra/ { next }
            /type=tcp/ && /sec(urity|ure)=none/ { next }               # Skip type=tcp + security=none (VULNERABLE), order-agnostic
            /sec(urity|ure)=none/ && !/type=xhttp/ { next }            # Skip secure=none without type=xhttp
            { print }                                                  # Output valid lines
            ' "$file" >> "$current"
        done

        now_epoch=$(date -u +%s)
        now_utc=$(date -u +%Y%m%dT%H%M%SZ)
        snapshot="$archive_dir/${now_utc}-${now_epoch}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
        cp "$current" "$snapshot"

        cutoff_epoch=$((now_epoch - 72 * 60 * 60))
        for snapshot_file in "$archive_dir"/*.txt; do
          snapshot_name=${snapshot_file##*/}
          snapshot_epoch=${snapshot_name#*-}
          snapshot_epoch=${snapshot_epoch%%-*}
          if [[ "$snapshot_epoch" =~ ^[0-9]+$ ]] && (( snapshot_epoch <= cutoff_epoch )); then
            rm -f "$snapshot_file"
          fi
        done

        # Combine oldest-to-newest snapshots and keep each entry's first occurrence.
        for snapshot_file in "$archive_dir"/*.txt; do
          cat "$snapshot_file" >> "$combined"
        done
        awk '!seen[$0]++' "$combined" > WHITE_LIST_PROXY_COLLECTION.txt

        echo "Lines & filename:" $(wc -l WHITE_LIST_PROXY_COLLECTION.txt)

    - name: Extract hysteria2 entries
      run: |
        set -euo pipefail
        tmp=$(mktemp)
        new=$(mktemp)
        awk 'BEGIN { IGNORECASE = 0 } /^(hysteria2|hy2):\/\// { print }' WHITE_LIST_PROXY_COLLECTION.txt > "$new"
        if [ -s "$new" ]; then
          now=$(date '+%Y-%m-%d %H:%M:%S')
          count=$(wc -l < "$new" | tr -d '[:space:]')
          printf '# %s (%s keys added)\n' "$now" "$count" > "$tmp"
          cat "$new" >> "$tmp"
          printf '\n' >> "$tmp"
        fi
        if [ -f HYSTERIA2.txt ]; then
          cat HYSTERIA2.txt >> "$tmp"
        fi
        awk '!seen[$0]++' "$tmp" > HYSTERIA2.txt || true
        rm -f "$tmp" "$new"
        echo "Extracted hysteria2 lines:" $(wc -l < HYSTERIA2.txt)

    - name: Extract trojan entries
      run: |
        set -euo pipefail
        tmp=$(mktemp)
        new=$(mktemp)
        awk '/^trojan:\/\// { print }' WHITE_LIST_PROXY_COLLECTION.txt > "$new"
        if [ -s "$new" ]; then
          now=$(date '+%Y-%m-%d %H:%M:%S')
          count=$(wc -l < "$new" | tr -d '[:space:]')
          printf '# %s (%s keys added)\n' "$now" "$count" > "$tmp"
          cat "$new" >> "$tmp"
          printf '\n' >> "$tmp"
        fi
        if [ -f TROJAN.txt ]; then
          cat TROJAN.txt >> "$tmp"
        fi
        awk '!seen[$0]++' "$tmp" > TROJAN.txt || true
        rm -f "$tmp" "$new"
        echo "Extracted trojan lines:" $(wc -l < TROJAN.txt)

    - name: Extract xhttp entries
      run: |
        set -euo pipefail
        tmp=$(mktemp)
        new=$(mktemp)
        awk '/^vless:\/\/.*[?&]type=xhttp(&|#|$)/ && !seen[$0]++ { print }' WHITE_LIST_PROXY_COLLECTION.txt > "$new"
        if [ -s "$new" ]; then
          now=$(date '+%Y-%m-%d %H:%M:%S')
          count=$(wc -l < "$new" | tr -d '[:space:]')
          printf '# %s (%s current keys)\n' "$now" "$count" > "$tmp"
          cat "$new" >> "$tmp"
          printf '\n' >> "$tmp"
        fi
        mv "$tmp" XHTTP.txt
        echo "Extracted xhttp lines:" "$(wc -l < "$new")"
        rm -f "$new"

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add WHITE_LIST_PROXY_COLLECTION WHITE_LIST_PROXY_COLLECTION.txt HYSTERIA2.txt TROJAN.txt XHTTP.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update the lists"

          # Attempt push with simple retry: on failure fetch+merge (prefer remote) and retry
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              break
            else
              echo "Push failed on attempt $attempt, fetching and merging remote..."
              git fetch origin main
              git merge --no-edit -X theirs origin/main || true
              sleep 1
            fi
          done
        fi
